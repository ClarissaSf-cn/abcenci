# Railway Nixpacks configuration for Laravel 12
[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_pgsql",
    "php83Extensions.pgsql",
    "php83Extensions.gd",
    "php83Extensions.fileinfo",
    "php83Extensions.mbstring",
    "php83Packages.composer",
    "nodejs_22"
]

[phases.install]
cmds = [
    "composer install --ignore-platform-reqs --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci --no-audit || npm install --no-audit"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan storage:link || true"
]

[start]
cmd = "php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
